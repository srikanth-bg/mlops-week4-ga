name: CI Week6 (MLflow)

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GAR_REGION }}
  GAR_REPO: ${{ secrets.GAR_REPO }}
  IMAGE_NAME: iris-api-image-wk6
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - uses: iterative/setup-cml@v2

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP key and export env
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_MLOPS_WEEK4 }}
        run: |
          KEY_FILE="${RUNNER_TEMP}/gcp-key.json"
          printf '%s' "$GCP_SA_KEY" > "$KEY_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Pull data from DVC
        run: dvc pull -v

      - name: Run unittest suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" > test_output.txt 2>&1
          echo "metric,value" > metrics.csv
          ACC_LINE=$(grep -i "accuracy" test_output.txt || true)
          if [ -z "$ACC_LINE" ]; then echo "accuracy,NA" >> metrics.csv; else echo "$ACC_LINE" | awk -F'[: ]+' '{print "accuracy,"$NF}' >> metrics.csv; fi

      - name: Post CML report comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Report (${GITHUB_REF_NAME})" > report.md
          echo "" >> report.md
          echo "### Test Output" >> report.md
          echo '```' >> report.md
          cat test_output.txt >> report.md
          echo '```' >> report.md
          echo "" >> report.md
          echo "### Metrics" >> report.md
          cat metrics.csv >> report.md
          cml comment create --publish report.md

      # -------------------- CD starts here (Week-6) --------------------

      # - name: Set up gcloud for build/deploy
      #   uses: google-github-actions/setup-gcloud@v2
      #   with:
      #     project_id: ${{ env.PROJECT_ID }}
      #     service_account_key: ${{ secrets.GCP_SA_KEY_WK6_ARTIFACT_REGISTRY }}
      #     export_default_credentials: true

      # 1) Authenticate first (uses JSON key secret)
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_WK6_ARTIFACT_REGISTRY }}

      # 2) Install gcloud + components (no auth inputs here)
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'   # needed for kubectl on newer clusters


      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev -q

      - name: Build & Push Docker image to GAR
        shell: bash
        run: |
          TAG=latest
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME:$TAG"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Get GKE credentials
        shell: bash
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER" --zone "$GKE_LOCATION" --project $PROJECT_ID

      - name: Deploy to GKE (update image + apply manifests)
        shell: bash
        run: |
          # Substitute image into deployment and apply
          sed "s|REPLACE_WITH_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        shell: bash
        run: |
          kubectl rollout status deploy/iris-api --timeout=180s
          kubectl get pods -l app=iris-api -o wide

      - name: Show Service and curl health
        id: probe
        shell: bash
        run: |
          # Try up to ~3 minutes to get an external IP
          for i in {1..18}; do
            EXTERNAL_IP=$(kubectl get svc iris-api-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -z "$EXTERNAL_IP" ]; then
              echo "Waiting for LoadBalancer external IP..."
              sleep 10
            else
              break
            fi
          done
          if [ -z "$EXTERNAL_IP" ]; then
            echo "::error::No EXTERNAL-IP yet. Check GKE service status."
            kubectl get svc iris-api-svc -o wide
            exit 1
          fi
          echo "EXTERNAL_IP=$EXTERNAL_IP" >> $GITHUB_ENV
          echo "Service external IP: $EXTERNAL_IP"

          echo "=== Curl root ==="
          curl -s "http://$EXTERNAL_IP/" || true

      - name: Test /predict endpoint with sample payload (if implemented)
        if: always()
        shell: bash
        run: |
          if [ -n "$EXTERNAL_IP" ]; then
            curl -s -X POST "http://$EXTERNAL_IP/predict/" \
              -H "Content-Type: application/json" \
              -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}' || true
          fi